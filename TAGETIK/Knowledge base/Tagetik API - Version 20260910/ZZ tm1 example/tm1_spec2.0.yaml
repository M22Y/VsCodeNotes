  /api/v1/Processes('Bedrock.Cube.Clone'):
    patch:
      summary: Process Update
      consumes:
        - application/json
      parameters:
        - name: Authorization
          in: header
          type: string
      responses: {}
      tags:
        - Processes
  /api/v1/Processes('z TEMP 10'):
    delete:
      summary: Process Delete
      consumes:
        - application/json
      responses: {}
      tags:
        - Processes
  '/api/v1/Chores(''{choreName}'')/tm1.Execute':
    parameters:
      - name: choreName
