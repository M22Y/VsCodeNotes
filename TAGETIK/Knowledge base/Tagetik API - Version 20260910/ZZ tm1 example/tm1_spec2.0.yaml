  '/api/v1/Chores(''{choreName}'')':
    parameters:
      - name: choreName
        in: path
        type: string
        required: true
    patch:
      summary: Chore Update
      consumes:
        - application/json
      parameters:
        - name: Authorization
          in: header
          type: string
      responses: {}
      tags:
        - Chores
  /api/v1/Configuration:
    get:
      summary: Configuration
      consumes:
        - application/json
      parameters:
        - name: Authorization
          in: header
          type: string
      responses: {}
      tags:
        - Administration
  /api/v1/$metadata:
    get:
      summary: Metadata
      consumes:
        - application/json
      parameters:
        - name: Authorization
          in: header
          type: string
      responses: {}
      tags:
        - Administration
  /api/v1/Threads:
    get:
      summary: Threads Get
      consumes:
        - application/json
      parameters:
        - name: $expand
          in: query
          type: string
        - name: Authorization
          in: header
          type: string
      responses: {}
      tags:
        - Administration
  /api/v1/MessageLogEntries:
    get:
      summary: Message Log Top 5
      consumes:
        - application/json
      parameters:
        - name: $orderby
          in: query
          type: string
        - name: $top
          in: query
          type: integer
        - name: Authorization
          in: header
          type: string
        - name: Prefer
          in: header
          type: string
      responses: {}
      tags:
        - Administration
  '/api/v1/Processes(''Cub.GeneralLedger.Demo'')/ErrorLogs(''2017-02-14T01{26}{44Z}'')/Content':
    get:
      summary: Process Error Logs
      consumes:
        - application/json
      parameters:
