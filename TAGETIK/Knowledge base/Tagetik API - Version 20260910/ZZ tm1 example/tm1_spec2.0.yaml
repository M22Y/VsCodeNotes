      summary: Attributes Get
      consumes:
        - application/json
      parameters:
        - name: Authorization
          in: header
          type: string
      responses: {}
      tags:
        - Dimensions
  '/api/v1/Processes(''{processName}'')/tm1.Execute':
    parameters:
      - name: processName
        in: path
        type: string
        required: true
    post:
      summary: Process Execute
      consumes:
        - application/json
      responses: {}
      tags:
        - Processes
  '/api/v1/Processes(''{processName}'')':
    parameters:
      - name: processName
        in: path
